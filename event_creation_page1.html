<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Your Event</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="event_creation_page1.css" />
  </head>
  <body>
    <main class="page">
      <section class="topbar">
        <div class="topbar-heading">
          <h1>Create Your Event</h1>
          <span class="step-pill">Step 1 of 2</span>
        </div>
        <div class="progress-track" aria-label="Progress">
          <div class="progress-fill"></div>
        </div>
      </section>

      <section class="card" aria-label="Event Basics">
        <header class="card-header">
          <div>
            <h2>Event Basics</h2>
            <p>Let's start with the basics of your event</p>
          </div>
        </header>

        <form class="event-form">
          <label for="eventName">Event Name *</label>
          <input
            id="eventName"
            type="text"
            placeholder="e.g., Morning photography walk in Central Park"
            aria-invalid="true"
          />
          <p class="error">Event name is required</p>

          <label for="category">Hobby Category *</label>
          <div class="select-wrap">
            <select id="category">
              <option selected>Hiking</option>
            </select>
          </div>

          <label for="level">Skill Level *</label>
          <div class="select-wrap">
            <select id="level">
              <option selected>Beginner - Just starting out</option>
            </select>
          </div>

          <hr />

          <div class="actions">
            <button type="button" class="btn btn-back">
              <span aria-hidden="true">←</span>
              Back
            </button>
            <button type="button" class="btn btn-next">
              Next
              <span aria-hidden="true">→</span>
            </button>
          </div>
        </form>
      </section>

      <p class="help">
        <span class="bulb" aria-hidden="true">💡</span>
        Need help? Check out our event creation guide or contact support.
      </p>
    </main>
  </body>
</html>
