<!DOCTYPE html>

<body> 
    <div class="center-wrapper">
    </div>

    <div style="flex-direction: column; justify-content: flex-start; align-items: center; gap: 4px; display: flex">

                <div style="justify-content: center; display: flex; flex-direction: column; color: white; font-size: 16px; font-family: Inter; font-weight: 500; line-height: 24px; word-wrap: break-word">Sign up with email</div>
            </button>
        </form>
    </div>
    <div style="align-self: stretch; justify-content: center; align-items: center; gap: 8px; display: inline-flex">
        <div style="flex: 1 1 0; height: 1px; background: #E6E6E6"></div>
        <div style="text-align: center; color: #828282; font-size: 16px; font-family: Inter; font-weight: 400; line-height: 24px; word-wrap: break-word">or continue with</div>
        <div style="flex: 1 1 0; height: 1px; background: #E6E6E6"></div>
    </div>
    <div style="width: 400px; height: 40px; position: relative; background: #EEEEEE; border-radius: 8px; margin: 0 auto;">
        <button style="width: 100%; height: 100%; background: #EEEEEE; border: none; border-radius: 8px; cursor: pointer; position: relative;">
            <div style="left: 172.50px; top: 8px; position: absolute; justify-content: center; display: flex; flex-direction: column; color: black; font-size: 16px; font-family: Inter; font-weight: 500; line-height: 24px; word-wrap: break-word">Google</div>
            <div style="width: 20px; height: 20px; left: 14px; top: 10px; position: absolute; overflow: hidden">
                <img src="C:\Users\Nike\Desktop\Dateien\Hochschule\IT\Friendsly App\Code\Log-in page\Google-icon.png" alt="Google" style="width: 20px; height: 20px">
            </div>
        </button>
    </div>
    <div style="align-self: stretch; text-align: center"><span style="color: black; font-size: 16px; font-family: Inter; font-weight: 400; line-height: 24px; word-wrap: break-word">By clicking continue, you agree to our </span><a href="#" style="color: #828282; font-size: 16px; font-family: Inter; font-weight: 400; line-height: 24px; word-wrap: break-word; text-decoration: none;">Terms of Service</a><span style="color: black; font-size: 16px; font-family: Inter; font-weight: 400; line-height: 24px; word-wrap: break-word"> and </span><a href="#" style="color: #828282; font-size: 16px; font-family: Inter; font-weight: 400; line-height: 24px; word-wrap: break-word; text-decoration: none;">Privacy Policy</a></div>
    </div>
</body>
    
</html>
