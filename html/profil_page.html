<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="profil_page.css">
    <title>Profil</title>
</head>

<body>
    <div class="layout">
        
        <aside class="sidebar">
            <nav>
                <a href="#" class="menu-item active">Dashboard</a>
                <a href="#" class="menu-item">Events</a>
                <a href="#" class="menu-item">Hobbies</a>
                <a href="#" class="menu-item">People</a>
                <a href="#" class="menu-item">Cities</a>
                <a href="#" class="menu-item">Explore</a>
                <a href="#" class="menu-item">Chat</a>
                <a href="#" class="menu-item">Support</a>
                <a href="#" class="menu-item">Settings</a>
            </nav>
        </aside>

        <main class="content">
            <header class="header">
                <img src="example.jpg" class="avatar">
                <h1>Profil_Name</h1>
            </header>

            <div class="tabs">
                <button class="tab active" type="button">All</button>
                <button class="tab" type="button">My Events</button>
                <button class="tab" type="button">My Hobbies</button>
                <button class="tab" type="button">My Friends</button>
                <button class="tab" type="button">My Cities</button>
            </div>

            <div class="description">
                <h2>Über mich</h2>
                <p>Hallo, ich bin das Beispielprofil. In dieser Beschreibung kann ich viel über mich erzählen.</p>
            </div>

            <div class="profil-container">
                <section class="feed">
                    <h2>Posts</h2>
                    <article class="post">
                        <div class="post-header">
                            <div>
                                <p class="post-name">Name_placeholder</p>
                                <span class="post-time">2h ago</span>
                            </div>
                        </div>
                        <div class="post-image placeholder fitness"></div>
                        <div class="post-body">
                            <p>Heute Morgen Workout!</p>
                            <div class="post-footer">
                                <span>❤</span>
                                <span>1234</span>
                            </div>
                        </div>
                    </article>
                </section>
            </div>
        </main>
    </div>
</body>
</html>
