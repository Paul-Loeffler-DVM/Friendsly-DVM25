<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="event_creation_page3.css" />
    <title>Event Created Successfully</title>
  </head>
  <body>
    <div class="layout">
      
      <aside class="sidebar">
        <div>
          <a href="#" class="menu-item">Dashboard</a>
          <a href="#" class="menu-item active">Events</a>
          <a href="#" class="menu-item">Hobbies</a>
          <a href="#" class="menu-item">People</a>
          <a href="#" class="menu-item">Cities</a>
          <a href="#" class="menu-item">Explore</a>
          <a href="#" class="menu-item">Profile</a>
          <a href="#" class="menu-item">Chat</a>
          <a href="#" class="menu-item">Support</a>
        </div>
      </aside>

      <main class="content">

        <header class="topbar-main">
          <div class="topbar-heading">
            <h1>Success</h1>
            <span class="step-pill">Complete</span>
          </div>
            <div class="progress-track">
              <div class="progress-fill"></div>
            </div>
        </header>

        <section class="card">
          <div class="success-message">
            <span class="success-icon">🎉</span>
            <h2>Congratulations!</h2>
            <p>Your event <span class="event-title-ref">[Event Title]</span> was created successfully.</p>
          </div>

          <hr class="hr-divider" />

          <div class="actions">
            <a href="/events" class="btn btn-next">
              Return to Events
              <span>→</span>
            </a>
          </div>
        </section>

        <p class="help">
          <span class="bulb">💡</span>
          Need help? Check out our event creation guide or contact support.
        </p>

      </main>
    </div>
  </body>
</html>
