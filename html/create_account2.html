<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="create_account2.css">
    <title>Account erstellen</title>
    
</head>
<body> 
    <div class="page-container">
        <div class="header-section">
            <img src="logo-friendsly.png" alt="App Logo" class="app-logo">
            <div class="main-title">Create Account</div>
        </div>
        
        <div class="form-section">
            <form action="#" method="post" class="signup-form">
                <input 
                    type="email" 
                    value="email@domain.com" 
                    disabled 
                    class="email-input email-disabled"
                >
                <div class="success-message">
                    Super, diese Mailadresse hat noch kein Konto bei uns.
                </div>
            
                <input 
                    type="text" 
                    placeholder="Benutzername" 
                    class="email-input" 
                    required
                >
                <input 
                    type="password" 
                    placeholder="Passwort" 
                    class="email-input" 
                    required
                >
                <input 
                    type="password" 
                    placeholder="Passwort wiederholen" 
                    class="email-input" 
                    required
                >
            
                <button type="submit" class="submit-btn">
                    Account erstellen
                </button>
            </form>
        </div>

        <div class="legal-notice">
            Our 
            <a href="index_Terms&Conditions.html" class="legal-link">Terms of Service</a> 
            and 
            <a href="index_Terms&Conditions.html" class="legal-link">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
