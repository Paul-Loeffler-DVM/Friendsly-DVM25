<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="create_account1.css">
    <title>Create Account</title>
</head>
<body> 
    <div class="page-container">
        <div class="header-section">
            <img src="logo-friendsly.png" alt="app icon" class="app-logo">
            <div class="main-title">Create an account</div>
            <div class="subtitle">Enter your email to sign up for this app</div>
        </div>

        <div class="form-section">
            <form action="#" method="post" class="signup-form">
                <input type="email" placeholder="email@domain.com" class="email-input" required>
                <button type="submit" class="submit-btn">
                    Sign up with email
                </button>
            </form>
        </div>

        <div class="divider">
            <div class="divider-line"></div>
            <div class="divider-text">or continue with</div>
            <div class="divider-line"></div>
        </div>

        <div class="google-btn-wrapper">
            <button class="google-btn">
                <div class="google-icon-wrapper">
                    <img src="google-icon.png" alt="Google" class="google-icon">
                </div>
                <span class="google-btn-text">Google</span>
            </button>
        </div>

        <div class="legal-notice">
            By clicking continue, you agree to our 
            <a href="index_Terms&Conditions.html" class="legal-link">Terms of Service</a> 
            and 
            <a href="index_Terms&Conditions.html" class="legal-link">Privacy Policy</a>
        </div>
    </div>
</body>
</html>
