<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="create_account.css">
    </head>

<body> 
    <div style="width: 100%; height: 100%; flex-direction: column; justify-content: flex-start; align-items: center; gap: 24px; display: inline-flex; padding-top: 15vh;">
        <div style="flex-direction: column; justify-content: flex-start; align-items: center; gap: 4px; display: flex">
            <img src="logo-friendsly.png" alt="app icon" width="250px" height="100px">
            <div style="text-align: center; color: black; font-size: 24px; font-family: Inter; font-weight: 600; line-height: 36px; word-wrap: break-word">Create Account</div>
        </div>
        
        <form action="#" method="post" style="display: flex; flex-direction: column; gap: 16px; width: 400px;">
            <input type="email" value="email@domain.com" disabled style="width: 400px; height: 40px; padding-left: 16px; padding-right: 16px; background: #f9f9f9; border-radius: 8px; border: 1px #E0E0E0 solid; font-size: 20px; font-family: Inter; color: #828282;">
            <div style="text-align: center; color: #27ae60; font-size: 14px; font-family: Inter; font-weight: 500;">Super, diese Mailadresse hat noch kein Konto bei uns.</div>
            
            <input type="text" placeholder="Benutzername" style="width: 400px; height: 40px; padding-left: 16px; padding-right: 16px; border-radius: 8px; border: 1px #E0E0E0 solid; font-size: 16px; font-family: Inter;" required>
            <input type="password" placeholder="Passwort" style="width: 400px; height: 40px; padding-left: 16px; padding-right: 16px; border-radius: 8px; border: 1px #E0E0E0 solid; font-size: 16px; font-family: Inter;" required>
            <input type="password" placeholder="Passwort wiederholen" style="width: 400px; height: 40px; padding-left: 16px; padding-right: 16px; border-radius: 8px; border: 1px #E0E0E0 solid; font-size: 16px; font-family: Inter;" required>
            
            <button type="submit" style="width: 400px; height: 40px; background: black; border-radius: 8px; color: white; border: none; cursor: pointer; font-size: 16px; font-family: Inter; font-weight: 500; margin-top: 8px;">
                Account erstellen
            </button>
        </form>
    </div>
</body>
</html>
