<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Created Successfully</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="event_creation_page3.css" />
  </head>
  <body>
    <main class="page">
      <section class="topbar">
        <div class="topbar-heading">
          <h1>Success</h1>
          <span class="step-pill">Complete</span>
        </div>
        <div class="progress-track" aria-label="Progress">
          <div class="progress-fill"></div>
        </div>
      </section>

      <section class="card" aria-label="Success Confirmation">
        <div class="success-message">
          <span class="success-icon" aria-hidden="true">🎉</span>
          <h2>Congratulations!</h2>
          <p>
            Your event <span class="event-title-ref">[Event Title]</span> was created successfully.
          </p>
        </div>

        <hr class="hr-divider" />

        <div class="actions">
          <a href="/events" class="btn btn-next">
            Return to Events
            <span aria-hidden="true">→</span>
          </a>
        </div>
      </section>

      <p class="help">
        <span class="bulb" aria-hidden="true">💡</span>
        Need help? Check out our event creation guide or contact support.
      </p>
    </main>
  </body>
</html>
