<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Create Your Event</title>
    <link rel="stylesheet" href="event_creation_page2.css" />
  </head>
  <body>
    <div class="layout">
        
      <aside class="sidebar">
        <div>
          <a href="#" class="menu-item">Dashboard</a>
          <a href="#" class="menu-item active">Events</a>
          <a href="#" class="menu-item">Hobbies</a>
          <a href="#" class="menu-item">People</a>
          <a href="#" class="menu-item">Cities</a>
          <a href="#" class="menu-item">Explore</a>
          <a href="#" class="menu-item">Profile</a>
          <a href="#" class="menu-item">Chat</a>
          <a href="#" class="menu-item">Support</a>
        </div>
      </aside>

      <main class="content">

        <header class="topbar-main">
          <div class="topbar-heading">
            <h1>Create Your Event</h1>
            <span class="step-pill">Step 2 of 2</span>
          </div>
            <div class="progress-track" aria-label="Progress">
              <div class="progress-fill"></div>
            </div>
        </header>

        <section class="card" aria-label="Event Details">
          <div class="card-header">
            <h2>Event Details</h2>
            <p>Give more in depth information about your event</p>
          </div>

          <form class="event-form">
            <label for="eventDate">Event Date *</label>
            <input
              id="eventDate"
              type="text"
              placeholder="e.g., from 12/12/2024 to 12/15/2024"
              aria-invalid="true"
            />
            <p class="error">Event date is required</p>

            <label for="category">Event Place *</label>
            <div class="select-wrap">
              <select id="category">
                <option selected>Stuttgart</option>
              </select>
            </div>

            <label for="level">Closed group or open to all? *</label>
            <div class="select-wrap">
              <select id="level">
                <option selected>Everyone is welcome</option>
              </select>
            </div>

            <hr />

            <div class="actions">
              <button type="button" class="btn btn-back">
                <span aria-hidden="true">←</span> Back
              </button>
              <button type="button" class="btn btn-next">
                Next <span aria-hidden="true">→</span>
              </button>
            </div>
          </form>
        </section>

      <p class="help">
        <span class="bulb" aria-hidden="true">💡</span>
        Need help? Check out our event creation guide or contact support.
      </p>
      </main>
    </div>
  </body>
</html>
